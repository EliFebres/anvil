allow-unwrap-in-tests = true

# anvil builds its one HTTP client in crates/anvil-core/src/net.rs, with
# redirects off. Building a client anywhere else fails `just check`.
disallowed-methods = [
    { path = "reqwest::Client::new", reason = "build HTTP clients only in anvil_core::net::http_client" },
    { path = "reqwest::Client::builder", reason = "build HTTP clients only in anvil_core::net::http_client" },
    { path = "reqwest::ClientBuilder::new", reason = "build HTTP clients only in anvil_core::net::http_client" },
    { path = "reqwest::get", reason = "send requests only through anvil_core::net::http_client" },
]
