# cargo-deny configuration: `cargo deny check` runs in CI (`.github/workflows/ci.yml`)
# and locally through `just deny`. Written for cargo-deny 0.18 and later
# (https://embarkstudios.github.io/cargo-deny/).

[graph]
# Check the platforms anvil ships for, not only the host, so a Windows-only or
# macOS-only dependency cannot slip past a Linux run.
targets = [
    "x86_64-unknown-linux-gnu",
    "x86_64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
]
all-features = false
no-default-features = false

[advisories]
# Every RustSec advisory (vulnerability, unmaintained, unsound, yanked) fails
# the check unless it is listed here with a reason.
ignore = [
    # chrono has no maintainer and no safe upgrade. It carries no known
    # vulnerability. Replacing it with jiff or time is a roadmap item.
    { id = "RUSTSEC-2026-0543", reason = "chrono unmaintained; replacement on the roadmap" },
]

[licenses]
# Permissive licenses found in the dependency tree. A new license fails the
# check until someone reviews it and adds it here.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.93
exceptions = []

[licenses.private]
# The workspace crates are not published; their own licenses are checked anyway.
ignore = false

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
deny = [
    # anvil uses rustls for TLS. OpenSSL and the platform TLS stacks must not
    # come back through a transitive dependency.
    { crate = "openssl-sys", reason = "TLS must come from rustls" },
    { crate = "openssl", reason = "TLS must come from rustls" },
    { crate = "native-tls", reason = "TLS must come from rustls" },
]

[sources]
# crates.io is the only place a dependency may come from.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
