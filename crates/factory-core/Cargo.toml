[package]
name = "factory-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Ticket queue, worker loop, git operations and merge policy for the factory."

[lib]
name = "factory_core"
path = "src/lib.rs"

[dependencies]
anvil-types.workspace = true
chrono.workspace = true
globset.workspace = true
# rustls on aws-lc-rs only: the workspace already uses that provider through
# reqwest, and a second one (octocrab's default `rustls-ring`) panics at runtime.
octocrab = { version = "0.54", default-features = false, features = ["rustls", "rustls-aws-lc-rs", "follow-redirect", "retry", "timeout", "default-client"] }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
ulid.workspace = true

[dev-dependencies]
insta.workspace = true
tempfile.workspace = true
wiremock.workspace = true

[lints]
workspace = true
