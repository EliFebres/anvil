[package]
name = "factory-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "The factory binary: the unattended improvement service. Argument parsing and wiring only."

# The library holds the wiring so the tests can run the service in-process
# with fakes; the binary parses arguments and calls into it.
[lib]
name = "factory_cli"
path = "src/lib.rs"

[[bin]]
name = "factory"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
anvil-tui.workspace = true
anvil-types.workspace = true
chrono.workspace = true
clap.workspace = true
eval.workspace = true
factory-core.workspace = true
factory-review.workspace = true
ratatui.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
tokio.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-appender.workspace = true
tracing-subscriber.workspace = true
ulid.workspace = true
unicode-width.workspace = true

[dev-dependencies]
insta.workspace = true
wiremock.workspace = true

[lints]
workspace = true
