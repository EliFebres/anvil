# anvil strict profile.
#
# Copy this file to ~/.anvil/profiles/strict.toml and run anvil with
# `--profile strict`. It replaces your own [permissions] and [shell] tables
# for the run. A managed policy's rules still apply on top.
#
# - Reading tools run without asking; they stay inside the workspace and
#   never open secret files.
# - Everything else asks first, including every MCP tool.
# - `shell` runs in allowlist mode: a command is one program from the list
#   below with plain arguments, started without a shell interpreter.
#   `;`, `&`, `|`, `<`, `>`, backticks, `$(`, parentheses, braces and line
#   breaks are refused, and no answer or `--yes` lifts that. Each allowed
#   call still asks.
# - The built-in deny categories (network clients, `git push`, `git clone`,
#   `git remote add` and `set-url`, package installs, `sudo` and `runas`,
#   `rm -rf` and the like) stay on in every mode.
#
# Allowlist mode guarantees which programs start, with which leading
# words, without a shell; that no argument names a path outside the
# project; and that git takes no option before its subcommand, never
# `--output`, `-o`, `--no-index`, `--ext-diff`, `--textconv` or `-O`, and
# runs with hooks, pagers, editors, diff programs and remotes off. It does
# not limit what an allowed program does with the project: `cargo build`
# runs build scripts and `cargo test` runs tests, which the model can
# write. Use the container executor when that matters.
#
# The list is narrow on purpose. `cargo *` would allow `cargo publish` and
# `--config` settings that name any program, `git *` would allow `git
# config` (which plants aliases and programs; anvil then refuses the
# repository), `just *` runs any recipe, and `rustc *` takes
# `-C linker=<any program>`.

[permissions]
default = "ask"
allow = ["read_file", "glob", "grep", "list_dir", "outline", "skill"]
deny = ["shell:git push*", "shell:git remote*", "shell:git config*"]

[shell]
mode = "allowlist"
allow = [
    # Residual risk: build scripts, procedural macros and tests run; they
    # are code the model can write.
    "cargo build *",
    "cargo check *",
    "cargo test *",
    "cargo clippy *",
    # Residual risk: rewrites Rust files in the project, which is its job.
    "cargo fmt *",
    # Residual risk: reads the repository and the work tree.
    "git status *",
    "git diff *",
    "git log *",
    "git show *",
    # Residual risk: changes the index and history of the project's own
    # repository; a signing program in the user's own git config runs.
    "git add *",
    "git commit *",
    # Residual risk: runs the project's `check` recipe, which the model
    # can edit; it is the project's own check.
    "just check",
]
