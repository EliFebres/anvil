# anvil managed policy: an example.
#
# Install as the administrator at:
#   Windows  C:\ProgramData\Anvil\policy.toml
#   macOS    /Library/Application Support/Anvil/policy.toml
#   Linux    /etc/anvil/policy.toml
# and make the folder writable by administrators only. anvil reads no other
# path, and no environment variable or flag changes it.
#
# The policy is a floor: the user's ~/.anvil/config.toml and the repository
# can add restrictions, never remove one. If this file exists but cannot be
# read or is invalid, anvil refuses to start. Every key below except
# [endpoints] allowed_base_urls is optional; the default of each is the
# restrictive choice and is shown in the comment.

[endpoints]
# The only model endpoints anvil may call. Required.
allowed_base_urls = ["https://models.corp.example/v1"]
# Hosts that may be called over plain http (default: none; loopback is
# always allowed).
allow_http_hosts = []

[project]
# false: ignore the repository's .anvil/ and load nothing it ships, even if
# the user trusts it (default: true; a repository can only tighten anyway).
config = true

[permissions]
# Whether --yes, --allow-tool, permissions.allow_tools and --profile may be
# used (default: false).
allow_skip_prompts = false
# A profile file in this same folder whose [permissions] table replaces the
# user's rules; the user's own deny, ask and shell_programs still apply.
# Copy profiles/strict.toml from the anvil repository next to this file.
profile = "strict.toml"
# Whether a plan needs a person even under --yes (default: false). In
# anvil build this is the top-level plan only; per-item sessions approve
# their own plans.
require_plan_approval = true

[extensions]
# Whether hooks run, the user's and a trusted repository's (default: false).
hooks = false
# The only MCP server programs that may start (default: none).
mcp_commands = []
# The only folders skills load from (default: none).
skill_dirs = ['C:\ProgramData\Anvil\skills']

[sessions]
# Where session folders go, one subfolder per repository (default: the
# repository's .anvil/sessions).
transcript_dir = 'D:\anvil-sessions'
# Delete session folders older than this when a session starts (default: keep).
retention_days = 30
# Whether the automatic summarizer call at session end runs
# (default: false).
summarizer_calls = false
