# factory configuration, written by `anvil setup` and committed.
# Provider names refer to [providers.<name>] entries in ~/.anvil/config.toml.

[roles]
coder = "anthropic"
# Optional: a provider that plans, and takes a build round when the coder is
# stuck. It may be a reviewer's model; the coder may not. Absent, the coder
# plans.
# planner = "anthropic"

# Each reviewer reads the pull request with one stance: correctness, safety,
# style or simplicity. Only correctness and safety block by default; findings
# of a non-blocking reviewer are posted as comments and never send a change
# back. Set `blocking = true` or `false` on a reviewer to override. Reviewers
# must run a different model than the coder (a different base URL or a
# different model name), so no model reviews its own work, and the blocking
# reviewers must run at least two different models between them, so no single
# model's blind spots decide a review.
[[reviewers]]
provider = "openai"
stance = "correctness"

[[reviewers]]
provider = "google"
stance = "safety"

[[reviewers]]
provider = "openai"
stance = "style"

[[reviewers]]
provider = "google"
stance = "simplicity"

[github]
repo = "EliFebres/anvil"

# The environment variable that holds a Discord, Slack or ntfy webhook URL,
# and the local time of the daily digest.
[notify]
webhook_env = "WEBHOOK_URL"
digest_at = "08:00"

# How often `factory run` polls factory/state and the tickets/* branches.
[service]
poll_minutes = 5

# Where the implementer runs. `runtime` is "podman", "docker" or "none" (no
# container; for tests and development only). `anvil_bin` is the anvil binary
# on this host: a name on PATH, or a path (a relative one starts at the
# repository root; symlinks are followed). The container gets it mounted
# read-only at /usr/local/bin/anvil, since the image ships none, and it must be
# the static musl build `factory update` makes: the image's glibc is older than
# the host's. `egress_allow` lists the hosts the container may reach besides
# every provider's base URL.
[worker]
runtime = "podman"
image = "localhost/anvil-factory:latest"
anvil_bin = "target/x86_64-unknown-linux-musl/release/anvil"
egress_allow = ["github.com", "index.crates.io", "static.crates.io"]

# Per-ticket limits. Exceeding one rejects the ticket with the reason. Tokens
# are weighted like anvil's budgets: cached input counts a tenth.
[budget]
wall_clock_minutes = 150
tokens = 9000000
review_rounds = 3

# Gate B (the release build and the eval) runs only when a changed path matches
# one of these globs: the paths that can change how anvil behaves. A diff that
# touches none of them skips both and the pull request says so. Without this
# table Gate B always runs.
[eval_gate]
paths = [
  "crates/anvil-*/**",
  "crates/eval/**",
  "skills/**",
  "eval/tasks/**",
  "Cargo.toml",
  "Cargo.lock",
  "rust-toolchain.toml",
]

# Paths the factory never merges on its own: a pull request touching one is
# labelled `needs-human` and its ticket waits. Globs match repository-relative
# paths. With `cargo_dependencies`, a new key under any `[dependencies]`-like
# table of any Cargo.toml needs a human too.
[protected]
paths = [
  "crates/factory-core/**",
  "crates/factory-review/**",
  "crates/eval/**",
  "deploy/**",
  ".github/**",
  "CLAUDE.md",
  "justfile",
  "factory.toml",
  "tickets/**",
  "crates/anvil-types/src/ticket.rs",
  "crates/anvil-types/src/boundary.rs",
  "crates/anvil-types/tests/queue.rs",
  "**/permissions*.toml",
]
cargo_dependencies = true
